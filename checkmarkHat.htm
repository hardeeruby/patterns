<html>

<style>
body {background-color: #ccc;
margin: 5px;
padding: 5px;
font-family: trebuchet ms;
font-size: 10pt;
line-height: 12pt;
color: #777;
#todo {
  accent-color: #777
}

#todo:checked+label {
  color: #777;
  text-decoration: line-through;
  &::before,
  &::after {
    -webkit-clip-path: inset(100%);
    clip-path: inset(100%);
    clip: rect 1px, 1px, 1px, 1px;
    height: 1px;
    overflow: hidden;
    position: absolute;
    white-space: nowrap;
    width: 1px;
  }
  &::before {
    content: "[start of stricken text]";
  }
  &::after {
    content: "[end of stricken text]";
  }
}
</style>
<body>
<head><title>This Fire Burns....always</title></head>

<form>
<input type="checkbox" id="todo">
<label for="todo">Todo Item</label>
  <label for="todo">Brother</label>
</form>



</body>
</html>
